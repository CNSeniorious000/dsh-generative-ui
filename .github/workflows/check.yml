name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            command: bun run fmt:check
          - name: lint
            command: bun run lint
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.command }}

  host:
    name: DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh: 0.2.1-rc.4
            cordis: 4.0.5
          - dsh: 0.2.2-rc.1
            cordis: 4.1.0
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install matching host packages
        env:
          DSH_VERSION: ${{ matrix.dsh }}
          CORDIS_VERSION: ${{ matrix.cordis }}
        run: |
          bun -e 'const p = await Bun.file("package.json").json(); for (const name of Object.keys(p.devDependencies)) if (name.startsWith("@deepseek-ai/dsh-")) p.devDependencies[name] = process.env.DSH_VERSION; p.devDependencies["@deepseek-ai/cordis"] = process.env.CORDIS_VERSION; await Bun.write("package.json", JSON.stringify(p, null, 2) + "\n")'
          rm bun.lock
          bun install --ignore-scripts
      - run: bun run typecheck
      - run: bun test test/host-compat.test.ts test/routes.test.ts test/session.test.ts test/prompt.test.ts test/skill.test.ts
      - run: bun run build
      - run: bun run smoke

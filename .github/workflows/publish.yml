name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'CNSeniorious000/dsh-generative-ui'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # The bundle is what ships, and a factory that throws on load fails the whole plugin silently.
      - run: bun run smoke

      - name: Bump package version
        id: version
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          bun pm version "$INCREMENT" --no-git-tag-version
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - run: bun pm pack --dry-run

      - name: Commit and tag release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release v${VERSION}"
          git tag "$TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}" "$TAG"

      - name: Pack package
        id: pack
        run: |
          tarball_dir="$(mktemp -d)"
          tarball="$(bun pm pack --destination "$tarball_dir" --quiet | awk 'NF { last = $0 } END { print last }')"
          case "$tarball" in /*) tarball_path="$tarball" ;; *) tarball_path="$tarball_dir/$tarball" ;; esac
          echo "tarball=$tarball_path" >> "$GITHUB_OUTPUT"

      # Provenance needs id-token: write (declared above) plus a GitHub-hosted runner, and a
      # `repository` field matching this repo case-sensitively — all three hold here.
      # --access public is required for the first publish of a new package name.
      - name: Publish package
        run: npm publish --provenance --access public "${{ steps.pack.outputs.tarball }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
